spring.application.name=Springdemo
server.port=8081

#修改后等待2 秒再重启，防止连续保存触发多次重启
#注意：Spring Boot 4 要求 poll-interval 必须大于 quiet-period
spring.devtools.restart.quiet-period=2s
spring.devtools.restart.poll-interval=3s
#排除静态资源，修改它们不触发重启
spring.devtools.restart.exclude=static/**,public/**,templates/**

# 静态资源映射：定义静态资源位置
spring.mvc.static-path-pattern=/images/**

spring.web.resources.static-locations=classpath:/META-INF/resources/, classpath:/resources/, classpath:/static/, classpath:/public/

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Swagger / OpenAPI（springdoc 3.1.1，Spring Boot 4 专用版本线）=====
# 默认就是下面这两个路径，写出来是为了让学习时一眼看到可以改
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# 接口按字母序排列，方便对照
springdoc.swagger-ui.operations-sorter=alpha
# 关掉生产环境不该暴露的接口文档时，改成 false 即可
springdoc.api-docs.enabled=true

# ===== 数据源：H2 内存库（学习用，零外部依赖）=====
# 注意 jdbc:h2:mem:xxx 后面的参数：
#   DB_CLOSE_DELAY=-1 让库在最后一个连接关闭后仍保留，否则连接池一回收数据就没了
#   MODE=MySQL 让 H2 兼容 MySQL 语法（分页 LIMIT、反引号、函数等），方便以后换 MySQL 时不改写 SQL
spring.datasource.url=jdbc:h2:mem:springdemo;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 每次启动都重建表结构并灌入演示数据（内存库，重启即重置）
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql,classpath:db/bookmark-schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
# 建表脚本里先 DROP TABLE IF EXISTS 再 CREATE，保证可重复执行
spring.sql.init.continue-on-error=false

# ===== MyBatis-Plus =====
# 控制台打印执行的 SQL，学习时能直接看到分页 LIMIT 和 JOIN 的真实语句
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# 数据库列名 user_name -> 实体属性 userName 的自动驼峰映射
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 手写 XML 的位置（多表关联查询放在这里）
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
# 主键策略：默认雪花算法会生成 19 位长整型，这里改成数据库自增，便于对照学习
mybatis-plus.global-config.db-config.id-type=auto

# 说明：H2 自带的 Web 控制台（spring.h2.console.*）在 Spring Boot 4 已被移除，
# 配置了也不生效，因此这里不再声明。
# 想直接看表里的数据，用本项目的接口即可：
#   GET /api/db/users/page?current=1&size=5
#   GET /api/db/users/with-dept
# 或打开 Swagger 页面在浏览器里点。